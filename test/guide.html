<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --paper:#efe6d2;
  --paper-deep:#e5d9bf;
  --card:#f7f0e0;
  --card-deep:#efe3c9;
  --ink:#2b2318;
  --ink-soft:#5a4c38;
  --ink-mute:#8a7657;
  --line:#b9a47c;
  --line-soft:#d6c7a5;
  --gold:#b0823f;
  --gold-deep:#8a642b;
  --green:#5f6f52;
  --green-deep:#46553a;
  --dipl:#b2453b;
  --hr:#4a6f9b;
  --gvg:#b06a24;
  --pve:#4f7a58;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(176,130,63,.14), transparent 60%),
    radial-gradient(900px 500px at -10% 30%, rgba(95,11,82,.12), transparent 55%),
    var(--paper);
  color:var(--ink);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1280px;margin:0 auto;padding:0 22px}
section{padding:56px 0}
.serif{font-family:"Noto Serif SC",serif}
.kicker{
  display:inline-flex;align-items:center;gap:10px;
  font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
  font-weight:500;text-transform:uppercase;margin-bottom:14px;
}
.kicker::before,.kicker::after{content:"";height:1px;width:34px;background:var(--line)}
h2{
  font-family:"Noto Serif SC",serif;
  font-size:clamp(26px,3.4vw,38px);
  font-weight:700;color:var(--ink);line-height:1.25;
}
.lead{color:var(--ink-soft);margin-top:12px;max-width:60ch;font-weight:300}
.frame{border:1px solid var(--line-soft);border-top:3px solid var(--gold);background:var(--card);padding:26px}

/* ========== 左侧目录侧边栏 ========== */
.nav-toggle{
  display:none;
  position:fixed;
  top:16px;
  left:16px;
  z-index:1001;
  width:40px;
  height:40px;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:2px;
  cursor:pointer;
  padding:0;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:5px;
}
.nav-toggle span{
  display:block;
  width:18px;
  height:2px;
  background:var(--ink);
  transition:.2s;
}
.nav-mask{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(43,35,24,.45);
  z-index:999;
}
.nav-mask.show{display:block;}

.sidebar{
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  width:200px;
  background:var(--card);
  border-right:1px solid var(--line-soft);
  z-index:1000;
  overflow-y:auto;
  padding:28px 0;
  transition:transform .25s ease;
}
.sidebar-inner{padding:0 16px;}
.sidebar-title{
  font-size:12px;
  letter-spacing:.3em;
  color:var(--gold-deep);
  text-transform:uppercase;
  font-weight:500;
  margin-bottom:16px;
  padding-left:4px;
}
.nav-list{display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:block;
  padding:9px 12px;
  font-size:14px;
  color:var(--ink-soft);
  text-decoration:none;
  border-radius:2px;
  border-left:2px solid transparent;
  transition:.15s;
}
.nav-item:hover{
  background:rgba(176,130,63,.08);
  color:var(--ink);
}
.nav-item.active{
  color:var(--ink);
  font-weight:600;
  border-left-color:var(--gold);
  background:rgba(176,130,63,.10);
}
.nav-level-1{
  font-weight: 600;
}
.nav-level-2{
  padding-left:28px;
  font-size:13px;
  position: relative;
}
.nav-level-2::before{
  content: "";
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--gold-deep);
  font-size: 18px;
  line-height: 1;
}
.nav-sub{display:flex;flex-direction:column;gap:1px;margin-top:1px;}
.nav-group{display:flex;flex-direction:column;}

footer{border-top:3px double var(--line);padding:34px 0 46px;text-align:center;color:var(--ink-mute);font-size:13px}
footer .seal{font-family:"Noto Serif SC",serif;font-size:15px;color:var(--gold-deep);letter-spacing:.3em;margin-bottom:8px}

/* 桌面端：常驻侧边栏，内容居中 */
@media (min-width:1024px){
  .wrap{
    margin: 0 auto;
    padding-left: 200px;
    max-width: 1280px;
    box-sizing: border-box;
  }
}

/* 移动端：抽屉式侧边栏 + 全局适配 */
@media (max-width:1023px){
  .nav-toggle{display:flex;}
  .sidebar{
    transform:translateX(-100%);
    box-shadow:2px 0 12px rgba(0,0,0,.15);
  }
  .sidebar.show{transform:translateX(0);}
}
@media (max-width:560px){
  html{-webkit-text-size-adjust:100%;}
  body{font-size:15px;}
  .wrap{padding:0 16px;}
  section{padding:36px 0;}
  h2{font-size:24px;}
  .lead{font-size:14px;}
  .kicker{font-size:11px;letter-spacing:.28em;}
  .frame{padding:18px;}
}
/* ---------- 管理员面板样式 ---------- */
.admin-panel{margin-top:40px;padding:20px;background:#e5d9bf;border-radius:8px;border:1px solid #b9a47c;display:none;}
.admin-panel.show{display:block;}
.admin-login{margin-top:40px;padding:16px;background:#efe3c9;border-radius:8px;border:1px dashed #b0823f;}
.admin-btn{background:#815c38;color:#fff;border:none;padding:8px 14px;border-radius:4px;margin:4px;cursor:pointer;}
.admin-btn:hover{background:#9b7042;}
.admin-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px;}
.admin-table th,.admin-table td{border:1px solid #b9a47c;padding:6px 8px;}
.admin-table th{
  background:#e5d9bf;
  font-weight:500;
  vertical-align: middle;
}
.club-edit-box{
  margin-bottom:16px;
  padding:12px 14px;
  background:#f7f0e0;
  border:1px solid #b9a47c;
  border-radius:4px;
}
.club-edit-box h4{
  margin-bottom:10px;
  font-size:15px;
  color:#2b2318;
}
.club-edit-row{
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:8px;
}
.club-edit-row label{
  font-size:13px;
  color:#5a4c38;
  white-space:nowrap;
  min-width:70px;
}
.club-edit-row input[type="text"],
.club-edit-row textarea,
.club-edit-row select{
  background:#f7f0e0;
  border:1px solid #b9a47c;
  color:#2b2318;
  padding:6px 8px;
  font-family:inherit;
  font-size:13px;
  border-radius:2px;
}
.club-edit-row textarea{
  width:100%;
  min-height:60px;
  resize:vertical;
}
.build-item{
  border:1px solid #b9a47c;
  border-radius:4px;
  padding:12px;
  margin-bottom:12px;
  background:#f7f0e0;
}
.build-item h5{
  font-size:14px;
  color:#2b2318;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:8px;
}
.build-item .build-tag{
  font-size:11px;
  padding:1px 6px;
  border-radius:2px;
  border:1px solid var(--gold-deep);
  color:var(--gold-deep);
}
.skill-row{
  display:grid;
  grid-template-columns: 1fr 2fr auto;
  gap:6px;
  margin-bottom:6px;
  align-items:center;
}
.skill-row input{
  width:100%;
}
.seal-row{
  display:grid;
  grid-template-columns: 1fr 2fr auto;
  gap:6px;
  margin-bottom:6px;
  align-items:center;
}
.seal-row input{
  width:100%;
}
.del-btn{
  padding:2px 8px;
  font-size:11px;
  background:#b2453b;
}
.del-btn:hover{
  background:#c2554b;
}
/* 配装模块小标题 */
.build-section-title{
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  border: 1px solid var(--ink-soft);
  color: var(--ink-soft);
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 8px;
}
/* 配装卡片字体 */
.guide-build-card{
  font-family: "方正姚体", "FZYaoti", "Noto Serif SC", serif;
}

.guide-build-card .build-section-title { font-weight: 700; }
</style>

<!-- 管理员入口区域 -->
<div class="wrap" style="padding-bottom: 56px;">
  <!--管理员登录入口-->
  <div class="admin-login">
    <h4>🔐 管理员入口</h4>
    <input id="adminPwdInput" placeholder="输入管理员密码" type="password">

  <!--管理员编辑面板，登录后显示-->
  <div class="admin-panel" id="adminPanel">
    <h3>📝 途径攻略编辑（修改后点保存到云端，所有人刷新页面生效）</h3>
    <div>
      <select id="pathSelect" onchange="renderBuildEditor()">
        <option value="warrior">战士</option>
        <option value="audience">观众</option>
        <option value="bard">歌颂</option>

        <option value="divination">占卜</option>

      </select>
      <button class="admin-btn" onclick="addBuild()">➕ 新增配装方案</button>
      <button class="admin-btn" onclick="saveGuideToBin()">💾保存到云端JSONBin</button>
      <button class="admin-btn" onclick="downloadGuideBackup()">📥导出备份JSON</button>
      <button class="admin-btn" onclick="reloadGuideFromBin()">🔄重新拉取云端数据</button>
    </div>
    <p style="font-size:12px;color:#5a4c38;margin:8px 0;">提示：编辑时上方展示区实时预览；保存后所有访问者刷新即可看到更新</p>

<script>
// ========== 配置 ==========
const ADMIN_PWD = "leilei666";
const GUIDE_BIN_ID = "6ab57c2affd5d160532b995b";
const API_KEY = "$2a$10$916yc2qjHuqVIHsTRPLYV.XQEqVu9VeBN5LrCIRbiVsi8FpXya1hu";

// 职业名称映射
const PATH_NAMES = {
  warrior: "战士",
  audience: "观众",
  bard: "歌颂",
  occult: "窥秘",
  divination: "占卜",
  apprentice: "学徒"
};

// 默认空数据
const DEFAULT_GUIDE = {
  warrior: [],
  audience: [],
  bard: [],
  occult: [],
  divination: [],
  apprentice: []
};
let GUIDE_DATA = JSON.parse(JSON.stringify(DEFAULT_GUIDE));

// ========== 侧边栏目录交互 ==========
const navToggle = document.getElementById('navToggle');
const sidebar = document.getElementById('sidebar');
const navMask = document.getElementById('navMask');
function toggleNav(show){
  if(show){
    sidebar.classList.add('show');
    navMask.classList.add('show');
  }else{
    sidebar.classList.remove('show');
    navMask.classList.remove('show');
  }
}
navToggle.addEventListener('click', ()=> toggleNav(!sidebar.classList.contains('show')));
navMask.addEventListener('click', ()=> toggleNav(false));

const navItems = document.querySelectorAll('.nav-item[href^="#"]');
const sections = ['top', 'warrior', 'audience', 'bard', 'occult', 'divination', 'apprentice'];
function updateActiveNav(){
  const scrollY = window.scrollY + 80;
  let current = 'top';
  for(let i = sections.length-1; i >= 0; i--){
    const el = document.getElementById(sections[i]);
    if(el && el.offsetTop <= scrollY){
      current = sections[i];
      break;
    }
  }
  navItems.forEach(item=>{
    const href = item.getAttribute('href');
    if(href === '#'+current){
      item.classList.add('active');
    }else{
      item.classList.remove('active');
    }
  });
}
window.addEventListener('scroll', updateActiveNav);

// ========== 云端数据读写 ==========
async function loadGuideBin(){
  try{
    const res = await fetch(`https://api.jsonbin.io/v3/b/${GUIDE_BIN_ID}/latest`,{
      headers:{"X-Master-Key":API_KEY}
    });
    const json=await res.json();
    const data = json.record;
    if(data && typeof data === 'object'){
      GUIDE_DATA = {...DEFAULT_GUIDE, ...data};
    }
  }catch(e){
    console.warn("攻略数据读取失败，使用默认空数据",e);
  }
  // 兼容旧单条人脉/秘偶数据，自动转为数组
  Object.keys(GUIDE_DATA).forEach(pathKey => {
    (GUIDE_DATA[pathKey] || []).forEach(build => {
      if(build.puppetSkill && build.puppetSkill.name && (!build.puppetSkills || !build.puppetSkills.length)){
        build.puppetSkills = [build.puppetSkill];
      }
      if(build.secretSkill && build.secretSkill.name && (!build.secretSkills || !build.secretSkills.length)){
        build.secretSkills = [build.secretSkill];
      }
    });
  });
}

async function saveGuideToBin(){
  try{
    const resp=await fetch(`https://api.jsonbin.io/v3/b/${GUIDE_BIN_ID}`,{
      method:"PUT",
      headers:{
        "X-Master-Key":API_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify(GUIDE_DATA)
    });
    if(resp.ok){
      alert("✅保存成功！刷新页面即可看到更新");
      renderGuideDisplay();
    }else{
      alert("❌保存失败，请检查GUIDE_BIN_ID是否正确");
    }
  }catch(err){
    alert("网络异常："+err.message);
  }
}

async function reloadGuideFromBin(){
  await loadGuideBin();
  renderGuideDisplay();
  if(document.getElementById("adminPanel").classList.contains("show")){
    renderBuildEditor();
  }
  alert("已重新拉取云端攻略数据");
}

function downloadGuideBackup(){
  const blob=new Blob([JSON.stringify(GUIDE_DATA,null,2)],{type:"application/json"});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download="回音俱乐部_途径攻略备份.json";
  a.click();
}

// ========== 前端展示渲染 ==========
function renderGuideDisplay(){
  const container = document.getElementById("guideDisplay");
  let html = "";
  
  Object.keys(PATH_NAMES).forEach(pathKey => {
    const builds = GUIDE_DATA[pathKey] || [];
    const pathName = PATH_NAMES[pathKey];
    
    html += '<section id="'+pathKey+'" style="padding: 16px 0; '+(pathKey !== 'apprentice' ? 'border-bottom:1px solid var(--line-soft);' : '')+'">';
    html += '<h3 style="font-family:\'Noto Serif SC\',serif; font-size:20px; margin-bottom:12px; color:var(--ink);">'+pathName+'</h3>';
    
    if(builds.length === 0){
      html += '<div style="color:var(--ink-soft); font-size:13px; padding: 10px 0;">暂无配装方案</div>';
    }else{
      builds.forEach(build => {
        html += '<div class="guide-build-card" style="margin-bottom:16px; padding:14px; border:1px solid var(--line-soft); border-radius:4px; background:rgba(255,255,255,.03);">';
        html += '<div style="display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:10px;">';
        html += '<div style="display:flex; align-items:center; gap:8px;">';
        html += '<div style="font-weight:600; font-size:15px; color:var(--ink);">'+(build.name || '未命名方案')+'</div>';
        if(build.tag){
          html += '<span style="font-size:11px; padding:1px 6px; border-radius:2px; border:1px solid var(--gold-deep); color:var(--gold-deep);">'+build.tag+'</span>';
        }
        html += '</div>';
        if(build.shareFrom){
          html += '<span style="font-family: \'方正姚体\', \'FZYaoti\', serif; font-weight: 700; font-style: italic; font-size: 12px; color: var(--gold-deep); margin-left: auto;">分享来自：'+build.shareFrom+'</span>';
        }
        html += '</div>';
        
        // 职业技能
        if(build.skills && build.skills.length){
          html += '<div style="margin-bottom:14px;">';
          html += '<div class="build-section-title">职业技能</div>';
          html += '<div style="font-size:13px; line-height: 1.6;">';
          build.skills.forEach(sk => {
            html += '<div style="margin-bottom: 8px;">';
            html += '<div style="font-weight:700; color:var(--ink);">'+(sk.name || '')+'</div>';
            html += '<div style="color:var(--ink-soft);">'+(sk.desc || '')+'</div>';
            html += '</div>';
          });
          html += '</div></div>';
        }
        
        // 人脉技能
        if(build.puppetSkills && build.puppetSkills.length){
          html += '<div style="margin-bottom:14px;">';
          html += '<div class="build-section-title">人脉技能</div>';
          html += '<div style="font-size:13px; line-height: 1.6;">';
          build.puppetSkills.forEach(sk => {
            html += '<div style="margin-bottom: 8px;">';
            html += '<div style="font-weight:700; color:var(--ink);">'+(sk.name || '')+'</div>';
            html += '<div style="color:var(--ink-soft);">'+(sk.desc || '')+'</div>';
            html += '</div>';
          });
          html += '</div></div>';
        }
        
        // 秘偶技能
        if(build.secretSkills && build.secretSkills.length){
          html += '<div style="margin-bottom:14px;">';
          html += '<div class="build-section-title">秘偶技能</div>';
          html += '<div style="font-size:13px; line-height: 1.6;">';
          build.secretSkills.forEach(sk => {
            html += '<div style="margin-bottom: 8px;">';
            html += '<div style="font-weight:700; color:var(--ink);">'+(sk.name || '')+'</div>';
            html += '<div style="color:var(--ink-soft);">'+(sk.desc || '')+'</div>';
            html += '</div>';
          });
          html += '</div></div>';
        }

        // 非凡天赋
        if(build.talent && build.talent.name){
          html += '<div style="margin-bottom:14px;">';
          html += '<div class="build-section-title">非凡天赋</div>';
          html += '<div style="font-size:13px; line-height: 1.6;">';
          html += '<div style="font-weight:700; color:var(--ink); margin-bottom: 2px;">'+build.talent.name+'</div>';
          html += '<div style="color:var(--ink-soft);">'+(build.talent.desc || '')+'</div>';
          html += '</div></div>';
        }

        // 封印物
        if(build.seals && build.seals.length){
          html += '<div style="margin-bottom:14px;">';
          html += '<div class="build-section-title">封印物</div>';
          html += '<div style="font-size:13px; line-height: 1.6;">';
          build.seals.forEach(se => {
            html += '<div style="margin-bottom: 6px;">';
            html += '<div style="font-weight:700; color:var(--ink);">'+(se.name || '')+'</div>';
            html += '<div style="color:var(--ink-soft);">'+(se.note || '')+'</div>';
            html += '</div>';
          });
          html += '</div></div>';
        }
        
        // 注意事项
        if(build.notice){
          html += '<div style="padding:10px 12px; background:rgba(176,130,63,.08); border-radius:4px; font-size:12px; color:var(--ink-soft); line-height:1.6;">';
          html += '<b style="color:var(--gold-deep);">注意事项：</b>'+build.notice.replace(/\n/g,'<br>');
          html += '</div>';
        }
        
        html += '</div>';
      });
    }
    
    html += '</section>';
  });
  
  container.innerHTML = html;
  updateActiveNav();
}

// ========== 管理员编辑逻辑 ==========
function adminLogin(){
  const inputPwd=document.getElementById("adminPwdInput").value;

    renderBuildEditor();
  }else{

}

function renderBuildEditor(){

  let html = '<div style="margin-bottom:8px; font-size:13px; color:#5a4c38;">当前职业：<b>'+PATH_NAMES[pathKey]+'</b>，共 '+builds.length+' 个方案</div>';
  
  builds.forEach((build, idx) => {
    html += '<div class="build-item" data-idx="'+idx+'">';
    html += '<h5>';
    html += '<input value="'+(build.name || '')+'" placeholder="方案名称" style="flex:1; padding:4px 8px; border:1px solid #b9a47c; background:#fff; border-radius:2px; font-size:13px;" oninput="updateBuild('+idx+', \'name\', this.value)">';
    html += '<input value="'+(build.shareFrom || '')+'" placeholder="分享人" style="width:140px; padding:4px 8px; border:1px solid #b9a47c; background:#fff; border-radius:2px; font-size:13px;" oninput="updateBuild('+idx+', \'shareFrom\', this.value)">';
    html += '<select style="padding:4px 6px; border:1px solid #b9a47c; background:#fff; border-radius:2px; font-size:12px;" onchange="updateBuild('+idx+', \'tag\', this.value)">';
    html += '<option value="">无标签</option>';
    html += '<option value="推荐" '+(build.tag==='推荐'?'selected':'')+'>推荐</option>';
    html += '<option value="进阶" '+(build.tag==='进阶'?'selected':'')+'>进阶</option>';
    html += '</select>';
    html += '<button class="admin-btn" style="padding:2px 8px; font-size:12px;" onclick="moveBuild('+idx+', -1)">↑</button>';
    html += '<button class="admin-btn" style="padding:2px 8px; font-size:12px;" onclick="moveBuild('+idx+', 1)">↓</button>';
    html += '<button class="admin-btn del-btn" onclick="deleteBuild('+idx+')">删除</button>';
    html += '</h5>';
      
    // 职业技能
    html += '<div style="margin-bottom:10px;">';
    html += '<div style="font-size:12px; color:#5a4c38; margin-bottom:4px;">职业技能</div>';
    html += '<div id="skills-'+idx+'">';
    (build.skills || []).forEach((sk, skIdx) => {
      html += '<div class="skill-row">';
      html += '<input value="'+(sk.name || '')+'" placeholder="技能名" oninput="updateSkill('+idx+', '+skIdx+', \'name\', this.value)">';
      html += '<input value="'+(sk.desc || '')+'" placeholder="效果描述" oninput="updateSkill('+idx+', '+skIdx+', \'desc\', this.value)">';
      html += '<button class="admin-btn del-btn" onclick="deleteSkill('+idx+', '+skIdx+')">删</button>';
      html += '</div>';
    });
    html += '</div>';
    html += '<button class="admin-btn" style="font-size:12px; padding:3px 10px;" onclick="addSkill('+idx+')">+ 新增技能</button>';
    html += '</div>';
      
    // 人脉技能
    html += '<div style="margin-bottom:10px;">';
    html += '<div style="font-size:12px; color:#5a4c38; margin-bottom:4px;">人脉技能</div>';
    html += '<div id="puppet-skills-'+idx+'">';
    (build.puppetSkills || []).forEach((sk, skIdx) => {
      html += '<div class="skill-row">';
      html += '<input value="'+(sk.name || '')+'" placeholder="技能名" oninput="updatePuppetSkill('+idx+', '+skIdx+', \'name\', this.value)">';

    html += '</div>';

    html += '<div style="margin-bottom:10px;">';

    html += '<div id="secret-skills-'+idx+'">';

      html += '<input value="'+(sk.name || '')+'" placeholder="技能名" oninput="updateSecretSkill('+idx+', '+skIdx+', \'name\', this.value)">';

    // 非凡天赋
    html += '<div style="margin-bottom:10px;">';

    html += '<div class="skill-row">';

    html += '<input value="'+(build.talent?.desc || '')+'" placeholder="天赋描述" oninput="updateSubSkill('+idx+', \'talent\', \'desc\', this.value)">';
    html += '<span></span>';
    html += '</div>';
    html += '</div>';
      
    // 封印物
    html += '<div style="margin-bottom:10px;">';
    html += '<div style="font-size:12px; color:#5a4c38; margin-bottom:4px;">封印物</div>';
    html += '<div id="seals-'+idx+'">';
    (build.seals || []).forEach((se, seIdx) => {
      html += '<div class="seal-row">';
      html += '<input value="'+(se.name || '')+'" placeholder="物品名称" oninput="updateSeal('+idx+', '+seIdx+', \'name\', this.value)">';
      html += '<input value="'+(se.note || '')+'" placeholder="参考说明" oninput="updateSeal('+idx+', '+seIdx+', \'note\', this.value)">';
      html += '<button class="admin-btn del-btn" onclick="deleteSeal('+idx+', '+seIdx+')">删</button>';
      html += '</div>';
    });
    html += '</div>';
    html += '<button class="admin-btn" style="font-size:12px; padding:3px 10px;" onclick="addSeal('+idx+')">+ 新增封印物</button>';
    html += '</div>';
      
    // 注意事项
    html += '<div>';
    html += '<div style="font-size:12px; color:#5a4c38; margin-bottom:4px;">注意事项</div>';
    html += '<textarea rows="3" placeholder="输入注意事项，支持换行" oninput="updateBuild('+idx+', \'notice\', this.value)">'+(build.notice || '')+'</textarea>';
    html += '</div>';
      
    html += '</div>';
  });
  
  container.innerHTML = html;
  renderGuideDisplay();
}

// 新增配装方案
function addBuild(){
  const pathKey = document.getElementById("pathSelect").value;
  GUIDE_DATA[pathKey].push({
    name: "新配装方案",
    tag: "",
    shareFrom: "",
    skills: [],
    puppetSkills: [],
    secretSkills: [],
    talent: {name:"", desc:""},
    seals: [],
    notice: ""
  });
  renderBuildEditor();
}

// 删除配装方案
function deleteBuild(idx){
  if(!confirm("确定删除这个配装方案？")) return;
  const pathKey = document.getElementById("pathSelect").value;
  GUIDE_DATA[pathKey].splice(idx, 1);
  renderBuildEditor();
}

// 移动方案顺序
function moveBuild(idx, dir){
  const pathKey = document.getElementById("pathSelect").value;
  const list = GUIDE_DATA[pathKey];
  const target = idx + dir;
  if(target < 0 || target >= list.length) return;
  const temp = list[idx];
  list[idx] = list[target];
  list[target] = temp;
  renderBuildEditor();
}

// 更新方案基础字段
function updateBuild(idx, field, value){
  const pathKey = document.getElementById("pathSelect").value;
  GUIDE_DATA[pathKey][idx][field] = value;
  renderGuideDisplay();
}

// 职业技能操作
function addSkill(buildIdx){
  const pathKey = document.getElementById("pathSelect").value;
  if(!GUIDE_DATA[pathKey][buildIdx].skills) GUIDE_DATA[pathKey][buildIdx].skills = [];
  GUIDE_DATA[pathKey][buildIdx].skills.push({name:"", desc:""});
  renderBuildEditor();
}
function updateSkill(buildIdx, skillIdx, field, value){
  const pathKey = document.getElementById("pathSelect").value;
  GUIDE_DATA[pathKey][buildIdx].skills[skillIdx][field] = value;
  renderGuideDisplay();
}
function deleteSkill(buildIdx, skillIdx){
  const pathKey = document.getElementById("pathSelect").value;
  GUIDE_DATA[pathKey][buildIdx].skills.splice(skillIdx, 1);
  renderBuildEditor();
}

// 非凡天赋更新
function updateSubSkill(buildIdx, skillKey, field, value){
  const pathKey = document.getElementById("pathSelect").value;
  if(!GUIDE_DATA[pathKey][buildIdx][skillKey]){
    GUIDE_DATA[pathKey][buildIdx][skillKey] = {name:"", desc:""};
  }
  GUIDE_DATA[pathKey][buildIdx][skillKey][field] = value;
  renderGuideDisplay();
}
