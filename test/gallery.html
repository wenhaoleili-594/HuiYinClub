:root{

/* ========== 左侧目录侧边栏 ========== */
.nav-toggle{
  display:none;
  position:fixed;
  top:16px;
  left:16px;
  z-index:1001;
  width:40px;
  height:40px;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:2px;
  cursor:pointer;
  padding:0;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:5px;
}
.nav-toggle span{
  display:block;
  width:18px;
  height:2px;
  background:var(--ink);
  transition:.2s;
}
.nav-mask{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(43,35,24,.45);
  z-index:999;
}
.nav-mask.show{display:block;}
.sidebar{
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  width:200px;
  background:var(--card);
  border-right:1px solid var(--line-soft);
  z-index:1000;
  overflow-y:auto;
  padding:28px 0;
  transition:transform .25s ease;
}
.sidebar-inner{padding:0 16px;}
.sidebar-title{
  font-size:12px;
  letter-spacing:.3em;
  color:var(--gold-deep);
  text-transform:uppercase;
  font-weight:500;
  margin-bottom:16px;
  padding-left:4px;
}
.nav-list{display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:block;
  padding:9px 12px;
  font-size:14px;
  color:var(--ink-soft);
  text-decoration:none;
  border-radius:2px;
  border-left:2px solid transparent;
  transition:.15s;
}
.nav-item:hover{
  background:rgba(176,130,63,.08);
  color:var(--ink);
}
.nav-item.active{
  color:var(--ink);
  font-weight:600;
  border-left-color:var(--gold);
  background:rgba(176,130,63,.10);
}
.nav-level-1{ font-weight: 600; }
.nav-level-2{
  padding-left:28px;
  font-size:13px;
  position: relative;
}
.nav-sub{display:flex;flex-direction:column;gap:1px;margin-top:1px;}
.nav-group{display:flex;flex-direction:column;}
footer{border-top:3px double var(--line);padding:34px 0 46px;text-align:center;color:var(--ink-mute);font-size:13px}
footer .seal{font-family:"Noto Serif SC",serif;font-size:15px;color:var(--gold-deep);letter-spacing:.3em;margin-bottom:8px}

/* 移动端：抽屉式侧边栏 + 全局适配 */

  .swiper-btns{ display: none; }

/* 轮播容器 - 复古四角细框 */
.swiper{
  position:relative;
  width: 84%;
  margin: 0 auto;
  border-radius: 2px;
  overflow: visible;
  aspect-ratio: 16 / 9;
  background: var(--card);
  padding: 14px;
  border: 1px solid var(--line);
  box-shadow:
    0 6px 18px rgba(43,35,24,.12),
    0 0 0 1px rgba(176,130,63,.25);
}
/* 四角装饰 */
.swiper::before,
.swiper::after,
.swiper > .corner-tl,
.swiper > .corner-br{
  content:"";
  position:absolute;
  width: 18px;
  height: 18px;
  border-color: var(--gold-deep);
  border-style: solid;
  z-index: 3;
  pointer-events: none;
}
.swiper::before{
  top: 4px;
  left: 4px;
  border-width: 2px 0 0 2px;
}
.swiper::after{
  bottom: 4px;
  right: 4px;
  border-width: 0 2px 2px 0;
}
.swiper > .corner-tl{
  top: 4px;
  right: 4px;
  border-width: 2px 2px 0 0;
}
.swiper > .corner-br{
  bottom: 4px;
  left: 4px;
  border-width: 0 0 2px 2px;
}
/* 轮播视口（裁剪图片） */
.swiper-viewport{
  width: 100%;
  height: 100%;
  border-radius: 2px;
  overflow: hidden;
  border: 1px solid var(--gold);
  box-shadow: inset 0 0 0 3px var(--card), inset 0 0 0 4px var(--line-soft);
}
/* 轮播滚动轨道 */
.swiper-track{
  display:flex;
  height:100%;
  transition: transform .6s ease;
}
.swiper-slide{
  flex: 0 0 100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}
.swiper-slide img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius: 2px;
}
/* 轮播外框左右按钮 */
.swiper-btns{
  position:absolute;
  top: 50%;
  transform: translateY(-50%);
  left: -44px;
  right: -44px;
  display:flex;
  justify-content: space-between;
  pointer-events: none;
  z-index: 4;
}
.swiper-btn{
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--gold-deep);
  color: var(--gold-deep);
  font-size: 18px;
  font-weight: 700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition: .2s;
  box-shadow: 0 2px 6px rgba(43,35,24,.12);
  pointer-events: auto;
}
.swiper-btn:hover{
  background: var(--gold);
  border-color: var(--gold-deep);
  color: #fff;
}
.swiper-dots{
  position:absolute;
  bottom: 22px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  z-index: 3;
}
.swiper-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:rgba(255,255,255,.5);
  cursor:pointer;
  transition:.2s;
}
.swiper-dot.active{ background:#fff; }
/* 配装卡片字体（复用） */

/* ---------- 富文本编辑器样式 ---------- */

.desc-toolbar select,
.desc-toolbar input[type="color"]{

.upload-row{

.upload-preview{

  object-fit:cover;
  border:1px solid #d6c7a5;

</style>

<script>
// ========== 配置 ==========
const ADMIN_PWD = "leilei666";
const GALLERY_BIN_ID = "6ab643eaac6210605af3d0ff";
const API_KEY = "$2a$10$916yc2qjHuqVIHsTRPLYV.XQEqVu9VeBN5LrCIRbiVsi8FpXya1hu";
const MAX_SAVE_SIZE = 1.5 * 1024 * 1024; // 1.5MB 安全上限
// 默认空数据
const DEFAULT_GALLERY = [
  {
    title: "第一届自行车大赛",
    anchor: "race1",
    desc: "记录公会首次线下自行车团建活动的精彩瞬间。",
    descStyle: {
      fontFamily: "inherit",
      fontSize: "15px",
      color: "#5a4c38",
      textAlign: "left",
      fontWeight: "normal"
    },
    images: []
  }
];
let GALLERY_DATA = JSON.parse(JSON.stringify(DEFAULT_GALLERY));
let currentEditIdx = 0;
// ========== 侧边栏交互 ==========
const navToggle = document.getElementById('navToggle');
const sidebar = document.getElementById('sidebar');
const navMask = document.getElementById('navMask');
function toggleNav(show){
  if(show){
    sidebar.classList.add('show');
    navMask.classList.add('show');
  }else{
    sidebar.classList.remove('show');
    navMask.classList.remove('show');
  }
}
navToggle.addEventListener('click', ()=> toggleNav(!sidebar.classList.contains('show')));
navMask.addEventListener('click', ()=> toggleNav(false));
// ========== 云端数据读写 ==========
async function loadGalleryBin(){
  try{
    const res = await fetch(`https://api.jsonbin.io/v3/b/${GALLERY_BIN_ID}/latest`,{
      method: "GET",
      headers: {
        "X-Master-Key": API_KEY,
        "Content-Type": "application/json"
      }
    });
    if(!res.ok) throw new Error("HTTP "+res.status);
    const json=await res.json();
    if(json.record && Array.isArray(json.record)){
      GALLERY_DATA = json.record;
    }
  }catch(e){
    console.warn("风采数据读取失败，使用默认数据", e);
  }
}
async function saveGalleryToBin(){
  syncDescFromEditor();
  
  const dataStr = JSON.stringify(GALLERY_DATA);
  const sizeKB = (dataStr.length / 1024).toFixed(1);
  
  if(dataStr.length > MAX_SAVE_SIZE){
    alert("⚠️ 数据过大，保存失败\n\n当前大小："+sizeKB+" KB\n上限：约 1500 KB\n\n建议：\n1. 减少图片数量\n2. 正式环境请改用图床链接");
    return;
  }
  
  try{
    const resp = await fetch(`https://api.jsonbin.io/v3/b/${GALLERY_BIN_ID}`,{
      method: "PUT",
      headers:{
        "X-Master-Key": API_KEY,
        "Content-Type": "application/json"
      },
      body: dataStr
    });
    
    if(resp.ok){
      alert("✅保存成功！当前数据大小："+sizeKB+" KB");
      renderGalleryDisplay();
    }else{
      const errText = await resp.text();
      alert("❌保存失败\n状态码："+resp.status+"\n"+errText.slice(0,120));
    }
  }catch(err){
    alert("❌ 请求失败\n"+err.message);
    console.error(err);
  }
}
async function reloadFromBin(){
  await loadGalleryBin();
  renderGalleryDisplay();
  if(document.getElementById("adminPanel").classList.contains("show")){
    renderAlbumEditor();
  }
  alert("已重新拉取云端数据");
}
function downloadBackup(){
  const blob=new Blob([JSON.stringify(GALLERY_DATA,null,2)],{type:"application/json"});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download="回音俱乐部_风采展示备份.json";
  a.click();
}
// ========== 前端展示渲染 ==========
function renderGalleryDisplay(){
  const container = document.getElementById("galleryDisplay");
  let html = "";
  
  GALLERY_DATA.forEach((album, idx) => {
    const style = album.descStyle || {};
    const descStyle = `
      font-family: ${style.fontFamily || 'inherit'};
      font-size: ${style.fontSize || '15px'};
      color: ${style.color || '#5a4c38'};
      text-align: ${style.textAlign || 'left'};
      font-weight: ${style.fontWeight || 'normal'};
    `;
    
    html += `<div class="gallery-item" id="${album.anchor || 'album-'+idx}">
      <h3 class="gallery-title">${album.title}</h3>
      <div class="gallery-desc" style="${descStyle}">${album.desc || ''}</div>`;
    
    if(album.images && album.images.length){
      const sortedImages = [...album.images].sort((a,b)=> (a.order||0) - (b.order||0));
      
      html += `<div class="swiper" data-idx="${idx}"><span class="corner-tl"></span><span class="corner-br"></span><div class="swiper-viewport"><div class="swiper-track">`;
      sortedImages.forEach(img => {
        html += `<div class="swiper-slide"><img src="${img.url}" alt="${album.title}" loading="lazy"></div>`;
      });
      html += `</div></div>
        <div class="swiper-btns">
          <button class="swiper-btn swiper-prev" onclick="swiperPrev(${idx})">‹</button>
          <button class="swiper-btn swiper-next" onclick="swiperNext(${idx})">›</button>
        </div>
        <div class="swiper-dots">`;
      sortedImages.forEach((_,i)=>{
        html += `<span class="swiper-dot ${i===0?'active':''}" onclick="swiperGoTo(${idx},${i})"></span>`;
      });
      html += `</div></div>`;
    }
    
    html += `</div>`;
  });
  
  container.innerHTML = html;
  initAllSwipers();
}
// ========== 轮播控制 ==========
let swiperStates = {};
let swiperTimers = {};
function initAllSwipers(){
  Object.values(swiperTimers).forEach(t=> clearInterval(t));
  swiperStates = {};
  swiperTimers = {};
  
  document.querySelectorAll('.swiper').forEach((el, idx) => {
    swiperStates[idx] = 0;
    swiperTimers[idx] = setInterval(()=>{
      swiperNext(idx);
    }, 4000);
  });
}
function swiperGoTo(idx, slideIdx){
  const swiper = document.querySelectorAll('.swiper')[idx];
  if(!swiper) return;
  const track = swiper.querySelector('.swiper-track');
  const dots = swiper.querySelectorAll('.swiper-dot');
  const total = swiper.querySelectorAll('.swiper-slide').length;
  
  slideIdx = (slideIdx + total) % total;
  swiperStates[idx] = slideIdx;
  track.style.transform = `translateX(-${ (slideIdx * 100) / total }%)`;
  
  dots.forEach((d,i)=> d.classList.toggle('active', i===slideIdx));
  
  clearInterval(swiperTimers[idx]);
  swiperTimers[idx] = setInterval(()=>{ swiperNext(idx); }, 4000);
}
function swiperNext(idx){
  const swiper = document.querySelectorAll('.swiper')[idx];
  if(!swiper) return;
  const total = swiper.querySelectorAll('.swiper-slide').length;
  swiperGoTo(idx, swiperStates[idx] + 1);
}
function swiperPrev(idx){
  swiperGoTo(idx, swiperStates[idx] - 1);
}
// ========== 管理员编辑逻辑 ==========
function adminLogin(){
  const inputPwd=document.getElementById("adminPwdInput").value;
  if(inputPwd===ADMIN_PWD){
    document.getElementById("adminPanel").classList.add("show");
    renderAlbumEditor();
  }else{
    alert("密码错误");
  }
}

    html += `<div class="build-item" data-idx="${idx}">
      <h5>
        <input value="${album.title || ''}" placeholder="相册标题" style="flex:1; padding:4px 8px; border:1px solid #b9a47c; background:#fff; border-radius:2px; font-size:13px;" oninput="updateAlbum(${idx}, 'title', this.value)">
        <input value="${album.anchor || ''}" placeholder="锚点ID" style="width:120px; padding:4px 8px; border:1px solid #b9a47c; background:#fff; border-radius:2px; font-size:13px;" oninput="updateAlbum(${idx}, 'anchor', this.value)">
        <button class="admin-btn" style="padding:2px 8px; font-size:12px;" onclick="moveAlbum(${idx}, -1)">↑</button>
        <button class="admin-btn" style="padding:2px 8px; font-size:12px;" onclick="moveAlbum(${idx}, 1)">↓</button>

      </h5>
      
      <div style="margin-bottom:10px;">
        <div style="font-size:12px; color:#5a4c38; margin-bottom:4px;">介绍文字（选中文字可单独设置样式）</div>
        
        <div class="desc-toolbar">
          <button type="button" onclick="execFormat('bold')" title="加粗"><b>B</b></button>
          <select onchange="execFormat('fontName', this.value); this.selectedIndex=0;">
            <option value="">字体</option>
            <option value="方正姚体">方正姚体</option>
            <option value="Noto Serif SC">思源宋体</option>
            <option value="Noto Sans SC">思源黑体</option>
          </select>
          <select onchange="setFontSize(this.value); this.selectedIndex=0;">
            <option value="">字号</option>
            <option value="12px">12px</option>
            <option value="14px">14px</option>
            <option value="15px">15px</option>
            <option value="18px">18px</option>
            <option value="20px">20px</option>
          </select>
          <input type="color" value="${style.color || '#5a4c38'}" onchange="execFormat('foreColor', this.value)" title="文字颜色">
          <button type="button" onclick="execFormat('justifyLeft')" title="左对齐">左</button>
          <button type="button" onclick="execFormat('justifyCenter')" title="居中">中</button>
          <button type="button" onclick="execFormat('justifyRight')" title="右对齐">右</button>
        </div>
        
        <div class="desc-editor" id="desc-editor-${idx}" contenteditable="true" 
          oninput="onDescInput(${idx})"
          onfocus="currentEditIdx=${idx}">${album.desc || ''}</div>
      </div>
      
      <div style="margin-bottom:10px;">
        <div style="font-size:12px; color:#5a4c38; margin-bottom:4px;">图片列表（推荐用图床链接，本地上传会自动压缩）</div>
        <div id="images-${idx}">`;
    
    (album.images || []).sort((a,b)=>(a.order||0)-(b.order||0)).forEach((img, imgIdx) => {
      html += `<div class="upload-row">
        <input value="${img.order || ''}" placeholder="排序" style="width:60px; padding:4px 6px; border:1px solid #b9a47c; background:#fff; border-radius:2px; font-size:12px;" oninput="updateImage(${idx}, ${imgIdx}, 'order', this.value)">
        <div style="display:flex; gap:8px; align-items:center; flex:1;">
          ${img.url ? `<img src="${img.url}" class="upload-preview" alt="">` : ''}
          <div style="display:flex; flex-direction:column; gap:4px; flex:1;">
            <input value="${img.url || ''}" placeholder="图片链接（推荐）" style="width:100%; padding:4px 6px; border:1px solid #b9a47c; background:#fff; border-radius:2px; font-size:12px;" oninput="updateImage(${idx}, ${imgIdx}, 'url', this.value)">
            <input type="file" accept="image/*" style="width:100%; font-size:12px;" onchange="uploadImage(${idx}, ${imgIdx}, this)">

// ========== 富文本操作 ==========
function execFormat(cmd, value){
  document.execCommand(cmd, false, value || '');
  syncDescFromEditor();
  renderGalleryDisplay();
}
function setFontSize(px){
  if(!px) return;
  const selection = window.getSelection();
  if(selection.rangeCount === 0 || selection.getRangeAt(0).collapsed) return;
  
  const range = selection.getRangeAt(0);
  const span = document.createElement('span');
  span.style.fontSize = px;
  
  try{
    range.surroundContents(span);
  }catch(e){
    document.execCommand('styleWithCSS', false, true);
    document.execCommand('fontSize', false, '3');
  }
  
  syncDescFromEditor();
  renderGalleryDisplay();
}
function onDescInput(idx){
  currentEditIdx = idx;
}
function syncDescFromEditor(){
  const editor = document.getElementById(`desc-editor-${currentEditIdx}`);
  if(editor && GALLERY_DATA[currentEditIdx]){
    GALLERY_DATA[currentEditIdx].desc = editor.innerHTML;
  }
}
// ========== 图片上传+强压缩 ==========
function uploadImage(albumIdx, imgIdx, input){
  const file = input.files[0];
  if(!file) return;
  
  // 强制压缩：最大宽 800px，质量 0.7
  compressImage(file, 800, 0.7).then(base64=>{
    GALLERY_DATA[albumIdx].images[imgIdx].url = base64;
    renderAlbumEditor();
  });
}
function compressImage(file, maxWidth, quality){
  return new Promise((resolve)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = function(e){
      img.src = e.target.result;
      img.onload = function(){
        const canvas = document.createElement('canvas');
        let w = img.width;
        let h = img.height;
        
        if(w > maxWidth){
          h = h * (maxWidth / w);
          w = maxWidth;
        }
        
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      }
    };
    reader.readAsDataURL(file);
  });
}
// ========== 相册操作 ==========
function addAlbum(){
  GALLERY_DATA.push({
    title: "新相册",
    anchor: "",
    desc: "",
    descStyle: { fontFamily:"inherit", fontSize:"15px", color:"#5a4c38", textAlign:"left", fontWeight:"normal" },
    images: []
  });
  renderAlbumEditor();
}
function deleteAlbum(idx){
  if(!confirm("确定删除这个相册？")) return;
  GALLERY_DATA.splice(idx, 1);
  renderAlbumEditor();
}
function moveAlbum(idx, dir){
  const target = idx + dir;
  if(target < 0 || target >= GALLERY_DATA.length) return;
  const temp = GALLERY_DATA[idx];
  GALLERY_DATA[idx] = GALLERY_DATA[target];
  GALLERY_DATA[target] = temp;
  renderAlbumEditor();
}
function updateAlbum(idx, field, value){
  GALLERY_DATA[idx][field] = value;
  renderGalleryDisplay();
}
// ========== 图片操作 ==========
function addImage(albumIdx){
  if(!GALLERY_DATA[albumIdx].images) GALLERY_DATA[albumIdx].images = [];
  const maxOrder = Math.max(0, ...GALLERY_DATA[albumIdx].images.map(i=> i.order||0));
  GALLERY_DATA[albumIdx].images.push({ url:"", order: maxOrder + 1 });
  renderAlbumEditor();
}
function updateImage(albumIdx, imgIdx, field, value){
  if(field === 'order') value = Number(value) || 0;
  GALLERY_DATA[albumIdx].images[imgIdx][field] = value;
  renderGalleryDisplay();
}
function deleteImage(albumIdx, imgIdx){
  GALLERY_DATA[albumIdx].images.splice(imgIdx, 1);
  renderAlbumEditor();
}
// ========== 页面启动 ==========
window.onload = function(){
  document.execCommand('styleWithCSS', false, true);
  loadGalleryBin().then(function(){
    renderGalleryDisplay();
  });
};
