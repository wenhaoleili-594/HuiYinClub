<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>《回音》俱乐部</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232b2318'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23b0823f' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23b0823f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --paper:#efe6d2;
  --paper-deep:#e5d9bf;
  --card:#f7f0e0;
  --card-deep:#efe3c9;
  --ink:#2b2318;
  --ink-soft:#5a4c38;
  --ink-mute:#8a7657;
  --line:#b9a47c;
  --line-soft:#d6c7a5;
  --gold:#b0823f;
  --gold-deep:#8a642b;
  --green:#5f6f52;
  --green-deep:#46553a;
  --dipl:#b2453b;
  --hr:#4a6f9b;
  --gvg:#b06a24;
  --pve:#4f7a58;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(176,130,63,.14), transparent 60%),
    radial-gradient(900px 500px at -10% 30%, rgba(95,11,82,.12), transparent 55%),
    var(--paper);
  color:var(--ink);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1280px;margin:0 auto;padding:0 22px}
section{padding:56px 0}
.serif{font-family:"Noto Serif SC",serif}
.kicker{
  display:inline-flex;align-items:center;gap:10px;
  font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
  font-weight:500;text-transform:uppercase;margin-bottom:14px;
}
.kicker::before,.kicker::after{content:"";height:1px;width:34px;background:var(--line)}
h2{
  font-family:"Noto Serif SC",serif;
  font-size:clamp(26px,3.4vw,38px);
  font-weight:700;color:var(--ink);line-height:1.25;
}
.lead{color:var(--ink-soft);margin-top:12px;max-width:60ch;font-weight:300}
.frame{border:1px solid var(--line-soft);border-top:3px solid var(--gold);background:var(--card);padding:26px}

/* ========== 左侧目录侧边栏 ========== */
.nav-toggle{
  display:none;
  position:fixed;
  top:16px;
  left:16px;
  z-index:1001;
  width:40px;
  height:40px;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:2px;
  cursor:pointer;
  padding:0;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:5px;
}
.nav-toggle span{
  display:block;
  width:18px;
  height:2px;
  background:var(--ink);
  transition:.2s;
}
.nav-mask{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(43,35,24,.45);
  z-index:999;
}
.nav-mask.show{display:block;}

.sidebar{
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  width:200px;
  background:var(--card);
  border-right:1px solid var(--line-soft);
  z-index:1000;
  overflow-y:auto;
  padding:28px 0;
  transition:transform .25s ease;
}
.sidebar-inner{padding:0 16px;}
.sidebar-title{
  font-size:12px;
  letter-spacing:.3em;
  color:var(--gold-deep);
  text-transform:uppercase;
  font-weight:500;
  margin-bottom:16px;
  padding-left:4px;
}
.nav-list{display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:block;
  padding:9px 12px;
  font-size:14px;
  color:var(--ink-soft);
  text-decoration:none;
  border-radius:2px;
  border-left:2px solid transparent;
  transition:.15s;
}
.nav-item:hover{
  background:rgba(176,130,63,.08);
  color:var(--ink);
}
.nav-item.active{
  color:var(--ink);
  font-weight:600;
  border-left-color:var(--gold);
  background:rgba(176,130,63,.10);
}
.nav-level-1{
  font-weight: 600;
}
.nav-level-2{
  padding-left:28px;
  font-size:13px;
  position: relative;
}
.nav-level-2::before{
  content: "";
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--gold-deep);
  font-size: 18px;
  line-height: 1;
}
.nav-sub{display:flex;flex-direction:column;gap:1px;margin-top:1px;}

footer{border-top:3px double var(--line);padding:34px 0 46px;text-align:center;color:var(--ink-mute);font-size:13px}
footer .seal{font-family:"Noto Serif SC",serif;font-size:15px;color:var(--gold-deep);letter-spacing:.3em;margin-bottom:8px}

/* 桌面端：常驻侧边栏，内容居中 */
@media (min-width:1024px){
  .wrap{
    margin: 0 auto;
    padding-left: 200px;
    max-width: 1280px;
    box-sizing: border-box;
  }
}

/* 移动端：抽屉式侧边栏 + 全局适配 */
@media (max-width:1023px){
  .nav-toggle{display:flex;}
  .sidebar{
    transform:translateX(-100%);
    box-shadow:2px 0 12px rgba(0,0,0,.15);
  }
  .sidebar.show{transform:translateX(0);}
}
@media (max-width:560px){
  html{-webkit-text-size-adjust:100%;}
  body{font-size:15px;}
  .wrap{padding:0 16px;}
  section{padding:36px 0;}
  h2{font-size:24px;}
  .lead{font-size:14px;}
  .kicker{font-size:11px;letter-spacing:.28em;}
  .frame{padding:18px;}
}
</style>
</head>
<body>
<!-- 移动端汉堡按钮 -->
<button class="nav-toggle" id="navToggle" aria-label="打开目录">
  <span></span><span></span><span></span>
</button>
<!-- 侧边栏遮罩（移动端） -->
<div class="nav-mask" id="navMask"></div>
<!-- 左侧目录侧边栏 -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-inner">
    <div class="sidebar-title">目录导航</div>
    <nav class="nav-list">
      <a href="index.html" class="nav-item nav-level-1">首页</a>
      <a href="index.html#overview" class="nav-item nav-level-2">成员概览</a>
      <a href="index.html#weekly" class="nav-item nav-level-2">每周活动</a>
      <a href="index.html#structure" class="nav-item nav-level-2">组织架构</a>
      <a href="index.html#roster" class="nav-item nav-level-2">成员名册</a>

      <!-- 风采展示（当前页） -->
      <div class="nav-group">
        <a href="#top" class="nav-item nav-level-1 active">风采展示</a>
        <div class="nav-sub">
          <a href="#race1" class="nav-item nav-level-2">第一届自行车大赛</a>
        </div>
      </div>

      <!-- 途径攻略 -->
      <div class="nav-group">
        <a href="guide.html" class="nav-item nav-level-1">途径攻略</a>
        <div class="nav-sub">
          <a href="guide.html#warrior" class="nav-item nav-level-2">战士</a>
          <a href="guide.html#audience" class="nav-item nav-level-2">观众</a>
          <a href="guide.html#bard" class="nav-item nav-level-2">歌颂</a>
          <a href="guide.html#occult" class="nav-item nav-level-2">窥秘</a>
          <a href="guide.html#divination" class="nav-item nav-level-2">占卜</a>
          <a href="guide.html#apprentice" class="nav-item nav-level-2">学徒</a>
        </div>
      </div>
    </nav>
  </div>
</aside>

<!-- 主体内容区：空白预留 -->
<section id="top">
  <div class="wrap">
    <span class="kicker">俱乐部风貌</span>
    <h2>风采展示</h2>
    <p class="lead">记录公会活动、精彩瞬间与成员作品。</p>
    
    <div class="frame" style="margin-top:30px;">
      <!-- 第一届自行车大赛 -->
      <section id="race1" style="padding: 22px 0; border-bottom: 1px solid var(--line-soft);">
        <h3 style="font-family:'Noto Serif SC',serif; font-size:20px; margin-bottom:10px; color:var(--ink);">第一届自行车大赛</h3>
        <div style="color:var(--ink-soft); min-height: 200px;">
          内容待补充
        </div>
      </section>

      <!-- 后续风采内容可继续添加到这里 -->
    </div>
  </div>
</section>
    </div>
<footer>
  <div class="wrap">
    <div class="seal">回 音</div>
    <p>本页为俱乐部内部信息展示，请勿恶意盗用。<br>愿长夜之中，你的低语始终有回响。</p>
  </div>
</footer>

<script>
// ========== 侧边栏目录交互 ==========
const navToggle = document.getElementById('navToggle');
const sidebar = document.getElementById('sidebar');
const navMask = document.getElementById('navMask');

function toggleNav(show){
  if(show){
    sidebar.classList.add('show');
    navMask.classList.add('show');
  }else{
    sidebar.classList.remove('show');
    navMask.classList.remove('show');
  }
}
navToggle.addEventListener('click', ()=> toggleNav(!sidebar.classList.contains('show')));
navMask.addEventListener('click', ()=> toggleNav(false));
// 页内滚动高亮二级目录
const navItems = document.querySelectorAll('.nav-item[href^="#"]');
const sections = ['top', 'race1'];

function updateActiveNav(){
  const scrollY = window.scrollY + 80;
  let current = 'top';
  for(let i = sections.length-1; i >= 0; i--){
    const el = document.getElementById(sections[i]);
    if(el && el.offsetTop <= scrollY){
      current = sections[i];
      break;
    }
  }
  navItems.forEach(item=>{
    const href = item.getAttribute('href');
    if(href === '#'+current){
      item.classList.add('active');
    }else{
      item.classList.remove('active');
    }
  });
}
window.addEventListener('scroll', updateActiveNav);
updateActiveNav();
</script>
</body>
</html>
